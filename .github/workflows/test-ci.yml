# https://xpack.github.io/logger-ts/
# https://github.com/xpack/logger-ts/actions/workflows/test-ci.yml

# Workflow for running some tests on each Push.
name: Test on Push

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

# -----------------------------------------------------------------------------

on:
  # Runs on pushes, if all conditions are met:
  push:
    # ... on the active branches ...
    branches:
      - 'master'
      - 'development'
    # ... skip tags only ...
    tags-ignore:
      - '**'
    paths-ignore:
      - '.claude/**'
      - '.github/skills/**'
      - '.github/workflows/publish-github-pages.yml'
      - '.github/workflows/test-all.yml'
      - '.github/copilot-instructions.md'
      - '.github/FUNDING.yml'
      - '.settings/**'
      - '.vscode/**'
      - 'maintenance/**'
      - 'tests/scripts/**'
      - 'website/**'
      - 'docs/**'
      - 'LICENSE*'
      - '**.md'
      - '.gitignore'
      - '.npmignore'
      - 'README*.md'

# Allow one concurrent run per push; new pushes cancel older runs.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: 'tests-ci-${{ github.ref_name }}'
  # A new push to the same branch cancels the older run.
  cancel-in-progress: true

jobs:
  ci-test:
    name: 'xPack Logger CI tests'

    runs-on: ${{matrix.os}}

    strategy:
      # Run all platforms to completion, even if one fails.
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images
        os:
          [
            'ubuntu-26.04',
            'ubuntu-26.04-arm',
            'macos-26-intel',
            'macos-26',
            'windows-2025'
          ]
        # https://nodejs.org/en - use LTS
        node-version: ['22', '24', '26']

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js ${{matrix.node-version}} on ${{matrix.os}}
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{matrix.node-version}}
          cache: 'npm'

      - name: Show environment
        run: |
          id
          uname -a
          node --version
          npm --version
          env | sort

      - name: Install dependencies
        run: npm ci

      - name: Run test
        run: npm run test-ci
        env:
          CI: true
